<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Main Slide 위젯</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/hero-main-slide.css">
</head>
<body>
<div class="app">

  <main class="editor__canvas editor__canvas--hero-main-slide">
    <div id="hmsWrap" class="iw-wrap iw-hero"
      aria-roledescription="carousel" aria-label="메인 배너" tabindex="0"
      data-autoplay="true" data-delay="5" data-effect="slide" data-paused="false" data-count="3">
      <!-- JS will fill this -->
    </div>
  </main>

  <aside class="inspector" id="hmsInspector">
    <div class="inspector__head">
      <span class="inspector__title">히어로 슬라이드</span>
      <button class="inspector__close" id="hmsInspectorClose" aria-label="닫기">&#x2715;</button>
    </div>
    <div class="inspector__body">

      <!-- 슬라이드 목록 -->
      <div class="inspector__section">
        <button class="inspector__sec-toggle" type="button">
          <span>슬라이드 목록</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">
          <button class="inspector__sec-add" id="hmsAddSlide" type="button">+ 슬라이드 추가</button>
          <div id="hmsSlideList"></div>
        </div>
      </div>

      <!-- 슬라이드 동작 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>슬라이드 동작</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">자동 재생</label>
            <button class="inspector__onoff active" id="hmsAutoplay" type="button"></button>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">전환 간격</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="hmsDelay" value="5" min="2" max="30">
              <span class="inspector__unit">초</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">전환 효과</label>
            <div class="inspector__layout-toggle">
              <button class="inspector__layout-btn active" id="hmsEffectSlide" type="button">슬라이드</button>
              <button class="inspector__layout-btn" id="hmsEffectFade" type="button">페이드</button>
            </div>
          </div>

        </div>
      </div>

      <!-- 헤더 겹치기 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>헤더 겹치기</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">헤더 높이 (PC)</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="hmsHeaderH" value="0" min="0" max="200">
              <span class="inspector__unit">px</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">헤더 높이 (모바일)</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="hmsHeaderHM" value="0" min="0" max="200">
              <span class="inspector__unit">px</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 스타일 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>스타일</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <p class="inspector__group-label">텍스트 색상</p>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="hmsTextSwatch" style="background:#ffffff">
                <input type="color" class="inspector__color-native" id="hmsTextPicker" value="#ffffff">
              </span>
              <input type="text" class="inspector__hex-input" id="hmsTextHex" value="#FFFFFF" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="hmsTextOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>

          <p class="inspector__group-label">인디케이터 색상</p>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="hmsLineSwatch" style="background:#ffffff">
                <input type="color" class="inspector__color-native" id="hmsLinePicker" value="#ffffff">
              </span>
              <input type="text" class="inspector__hex-input" id="hmsLineHex" value="#FFFFFF" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="hmsLineOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>

          <p class="inspector__group-label">오버레이</p>
          <div class="inspector__field">
            <label class="inspector__field-label">진하기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="hmsOverlayStrength" value="100" min="0" max="100">
              <span class="inspector__unit">%</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 크기 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>텍스트 크기</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">제목</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="hmsTitleSize" value="72" min="12" max="120">
              <span class="inspector__unit">px</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">설명</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="hmsDescSize" value="20" min="10" max="60">
              <span class="inspector__unit">px</span>
            </div>
          </div>

        </div>
      </div>

    </div><!-- /.inspector__body -->
    <div class="inspector__footer">
      <div class="inspector__footer-actions">
        <button class="inspector__footer-btn" id="hmsReset" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M2.5 8a5.5 5.5 0 1 0 1.1-3.3"/>
            <polyline points="2.5,2 2.5,5.5 6,5.5"/>
          </svg>
          초기화
        </button>
      </div>
    </div>
  </aside>

</div>
<script src="../js/hero-main-slide.js"></script>
</body>
</html>
