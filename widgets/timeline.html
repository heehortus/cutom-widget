<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>타임라인 위젯</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/timeline.css">
</head>
<body>
<div class="app">

      <main class="editor__canvas editor__canvas--timeline">
        <div class="timeline-widget" id="timelineWidget"></div>
      </main>

      <aside class="inspector" id="timelineInspector">
        <div class="inspector__head">
          <span class="inspector__title">타임라인 위젯</span>
          <button class="inspector__close" id="timelineInspectorClose" aria-label="닫기">&#x2715;</button>
        </div>
        <div class="inspector__body">

          <!-- 아이템 섹션 -->
          <div class="inspector__section collapsed">
              <button class="inspector__sec-toggle" type="button">
                <span>아이템</span>
                <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <polyline points="4,10 8,6 12,10"/>
                </svg>
              </button>
            <div class="inspector__sec-body">
              <button class="inspector__sec-add" id="addTimelineGroup" type="button">+ 그룹 추가</button>
              <div id="timelineGroupList"></div>
            </div>
          </div>

          <!-- 텍스트 섹션 -->
          <div class="inspector__section collapsed">
            <button class="inspector__sec-toggle" type="button">
              <span>텍스트</span>
              <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <polyline points="4,10 8,6 12,10"/>
              </svg>
            </button>
            <div class="inspector__sec-body">

              <p class="inspector__group-label">Era 라벨</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="tlEraSize" value="14" min="8" max="40">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="tlEraSwatchWrap" style="background:#555555">
                    <input type="color" class="inspector__color-native" id="tlEraPicker" value="#555555">
                  </span>
                  <input type="text" class="inspector__hex-input" id="tlEraHex" value="#555555" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="tlEraOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

              <p class="inspector__group-label">제목</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="tlHeadingSize" value="32" min="16" max="80">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="tlHeadingSwatchWrap" style="background:#1a1a1a">
                    <input type="color" class="inspector__color-native" id="tlHeadingPicker" value="#1a1a1a">
                  </span>
                  <input type="text" class="inspector__hex-input" id="tlHeadingHex" value="#1A1A1A" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="tlHeadingOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

              <p class="inspector__group-label">년도</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="tlYearSize" value="18" min="10" max="48">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="tlYearSwatchWrap" style="background:#1a1a1a">
                    <input type="color" class="inspector__color-native" id="tlYearPicker" value="#1a1a1a">
                  </span>
                  <input type="text" class="inspector__hex-input" id="tlYearHex" value="#1A1A1A" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="tlYearOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

              <p class="inspector__group-label">텍스트</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="tlTextSize" value="16" min="10" max="40">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="tlTextSwatchWrap" style="background:#6b7280">
                    <input type="color" class="inspector__color-native" id="tlTextPicker" value="#6b7280">
                  </span>
                  <input type="text" class="inspector__hex-input" id="tlTextHex" value="#6B7280" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="tlTextOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

            </div>
          </div>

          <!-- 트랙 섹션 -->
          <div class="inspector__section collapsed">
            <button class="inspector__sec-toggle" type="button">
              <span>트랙</span>
              <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <polyline points="4,10 8,6 12,10"/>
              </svg>
            </button>
            <div class="inspector__sec-body">

              <div class="inspector__field">
                <label class="inspector__field-label">비활성 컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="tlTrackInactiveSwatchWrap" style="background:#e0e0e0">
                    <input type="color" class="inspector__color-native" id="tlTrackInactivePicker" value="#e0e0e0">
                  </span>
                  <input type="text" class="inspector__hex-input" id="tlTrackInactiveHex" value="#E0E0E0" maxlength="7" spellcheck="false">
                </div>
              </div>

              <div class="inspector__field">
                <label class="inspector__field-label">활성 컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="tlTrackActiveSwatchWrap" style="background:#555555">
                    <input type="color" class="inspector__color-native" id="tlTrackActivePicker" value="#555555">
                  </span>
                  <input type="text" class="inspector__hex-input" id="tlTrackActiveHex" value="#555555" maxlength="7" spellcheck="false">
                </div>
              </div>

              <div class="inspector__field">
                <label class="inspector__field-label">Bullet 크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="tlBulletSize" value="10" min="4" max="24">
                  <span class="inspector__unit">px</span>
                </div>
              </div>

              <div class="inspector__field">
                <label class="inspector__field-label">그룹 간격</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="tlGroupGap" value="60" min="0" max="200">
                  <span class="inspector__unit">px</span>
                </div>
              </div>

            </div>
          </div>

        </div><!-- /.inspector__body -->
        <div class="inspector__footer">
          <div class="inspector__footer-actions">
            <button class="inspector__footer-btn" id="timelineReset" type="button">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
                <path d="M2.5 8a5.5 5.5 0 1 0 1.1-3.3"/>
                <polyline points="2.5,2 2.5,5.5 6,5.5"/>
              </svg>
              초기화
            </button>
          </div>
        </div>
      </aside>

</div>
<script src="../js/timeline.js"></script>
</body>
</html>
