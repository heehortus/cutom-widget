<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>워드 쉐이드 위젯</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/word-shade.css">
</head>
<body>
<div class="app">

  <main class="editor__canvas editor__canvas--word-shade">
    <div id="wordShadeWrap"></div>
  </main>

  <aside class="inspector" id="wordShadeInspector">
    <div class="inspector__head">
      <span class="inspector__title">워드 쉐이드</span>
      <button class="inspector__close" id="wsInspectorClose" aria-label="닫기">&#x2715;</button>
    </div>
    <div class="inspector__body">

      <!-- 텍스트 섹션 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>텍스트</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">내용</label>
            <input type="text" class="inspector__card-name-input" id="wsText" value="WORD SHADE" style="width:100%">
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">크기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="wsFontSize" value="120" min="20" max="400">
              <span class="inspector__unit">px</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="wsTextSwatch" style="background:#ffffff">
                <input type="color" class="inspector__color-native" id="wsTextPicker" value="#ffffff">
              </span>
              <input type="text" class="inspector__hex-input" id="wsTextHex" value="#FFFFFF" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="wsTextOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">굵기</label>
            <div class="inspector__layout-toggle" id="wsWeightSegment">
              <button class="inspector__layout-btn" type="button" data-value="400">보통</button>
              <button class="inspector__layout-btn active" type="button" data-value="700">굵게</button>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">정렬</label>
            <div class="inspector__layout-toggle" id="wsAlignSegment">
              <button class="inspector__layout-btn" type="button" data-value="left">왼쪽</button>
              <button class="inspector__layout-btn active" type="button" data-value="center">가운데</button>
              <button class="inspector__layout-btn" type="button" data-value="right">오른쪽</button>
            </div>
          </div>

        </div>
      </div>

      <!-- 배경 섹션 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>배경</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">
          <div class="inspector__field">
            <label class="inspector__field-label">배경 컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="wsBgSwatch" style="background:#000000">
                <input type="color" class="inspector__color-native" id="wsBgPicker" value="#000000">
              </span>
              <input type="text" class="inspector__hex-input" id="wsBgHex" value="#000000" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="wsBgOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 호버 딤 섹션 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>호버 딤</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">효과 사용</label>
            <button class="inspector__onoff active" id="wsHoverDim" type="button"></button>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">딤 컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="wsDimSwatch" style="background:#222222">
                <input type="color" class="inspector__color-native" id="wsDimPicker" value="#222222">
              </span>
              <input type="text" class="inspector__hex-input" id="wsDimHex" value="#222222" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="wsDimOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">전환 속도</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="wsDimSpeed" value="0.3" min="0" max="2" step="0.1">
              <span class="inspector__unit">초</span>
            </div>
          </div>

        </div>
      </div>

    </div><!-- /.inspector__body -->
    <div class="inspector__footer">
      <div class="inspector__footer-actions">
        <button class="inspector__footer-btn" id="wsReset" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M2.5 8a5.5 5.5 0 1 0 1.1-3.3"/>
            <polyline points="2.5,2 2.5,5.5 6,5.5"/>
          </svg>
          초기화
        </button>
      </div>
    </div>
  </aside>

</div>
<script src="../js/word-shade.js"></script>
</body>
</html>
