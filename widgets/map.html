<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지도 위젯</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/map.css">
</head>
<body>
<div class="app">

  <main class="editor__canvas editor__canvas--map">
    <div class="map-block">
      <h2 class="map-title" id="mapTitle">오시는 길</h2>
      <div class="map-widget" id="mapWidget"></div>
      <dl class="map-info map-info--grid" id="mapInfo">
        <div class="map-info__row"><dt class="map-info__label">주소</dt><dd class="map-info__value" data-info="address"></dd></div>
        <div class="map-info__row"><dt class="map-info__label">대표전화</dt><dd class="map-info__value" data-info="phone"></dd></div>
        <div class="map-info__row"><dt class="map-info__label">운영시간</dt><dd class="map-info__value" data-info="hours"></dd></div>
        <div class="map-info__row"><dt class="map-info__label">이메일</dt><dd class="map-info__value" data-info="email"></dd></div>
      </dl>
    </div>
  </main>

  <aside class="inspector" id="mapInspector">
    <div class="inspector__head">
      <span class="inspector__title">지도 위젯</span>
      <button class="inspector__close" id="mapInspectorClose" aria-label="닫기">&#x2715;</button>
    </div>
    <div class="inspector__body">

      <!-- 텍스트 -->
      <div class="inspector__section">
        <button class="inspector__sec-toggle" type="button">
          <span>텍스트</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="4,10 8,6 12,10"/>
          </svg>
        </button>
        <div class="inspector__sec-body">
          <input
            class="map-search-row__input map-title-input"
            type="text"
            id="mapTitleInput"
            value="오시는 길"
            placeholder="비워두면 텍스트가 숨겨집니다"
            autocomplete="off"
          >
          <div class="inspector__field">
            <label class="inspector__field-label">글자 크기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="mapTitleSize" value="28" min="12" max="64">
              <span class="inspector__unit">px</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">정렬</label>
            <div class="inspector__layout-toggle" id="mapTitleAlign">
              <button class="inspector__layout-btn active" data-align="left" type="button">왼쪽</button>
              <button class="inspector__layout-btn" data-align="center" type="button">가운데</button>
              <button class="inspector__layout-btn" data-align="right" type="button">오른쪽</button>
            </div>
          </div>
        </div>
      </div>

      <!-- 주소 검색 -->
      <div class="inspector__section">
        <button class="inspector__sec-toggle" type="button">
          <span>주소 검색</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="4,10 8,6 12,10"/>
          </svg>
        </button>
        <div class="inspector__sec-body">
          <div class="map-search-row">
            <input
              class="map-search-row__input"
              type="text"
              id="mapAddressInput"
              placeholder="건물명 또는 상호명 (예: 서울특별시청)"
              autocomplete="off"
            >
            <button class="map-search-row__btn" id="mapSearchBtn" type="button">검색</button>
          </div>
        </div>
      </div>

      <!-- 보조 텍스트 -->
      <div class="inspector__section">
        <button class="inspector__sec-toggle" type="button">
          <span>보조 텍스트</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="4,10 8,6 12,10"/>
          </svg>
        </button>
        <div class="inspector__sec-body">
          <div class="inspector__layout-toggle" id="mapInfoLayout">
            <button class="inspector__layout-btn active" data-layout="grid" type="button">2열 그리드</button>
            <button class="inspector__layout-btn" data-layout="list" type="button">세로 나열</button>
          </div>
          <label class="map-info-field">
            <span class="map-info-field__label">주소 (도로명)</span>
            <input class="map-search-row__input" type="text" data-info-input="address" placeholder="예: 서울특별시 중구 세종대로 110" autocomplete="off">
          </label>
          <label class="map-info-field">
            <span class="map-info-field__label">대표전화</span>
            <input class="map-search-row__input" type="text" data-info-input="phone" autocomplete="off">
          </label>
          <label class="map-info-field">
            <span class="map-info-field__label">운영시간</span>
            <input class="map-search-row__input" type="text" data-info-input="hours" autocomplete="off">
          </label>
          <label class="map-info-field">
            <span class="map-info-field__label">이메일</span>
            <input class="map-search-row__input" type="text" data-info-input="email" autocomplete="off">
          </label>
        </div>
      </div>

      <!-- 크기 설정 -->
      <div class="inspector__section">
        <button class="inspector__sec-toggle" type="button">
          <span>크기 설정</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="4,10 8,6 12,10"/>
          </svg>
        </button>
        <div class="inspector__sec-body">
          <div class="inspector__field">
            <label class="inspector__field-label">가로</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="mapWidth" value="600" min="200" max="1400">
              <span class="inspector__unit">px</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">세로</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="mapHeight" value="450" min="150" max="1000">
              <span class="inspector__unit">px</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 지도 옵션 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>지도 옵션</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="4,10 8,6 12,10"/>
          </svg>
        </button>
        <div class="inspector__sec-body">
          <div class="inspector__field">
            <label class="inspector__field-label">확대 레벨</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="mapZoomLevel" value="3" min="1" max="5">
              <span class="inspector__unit">/ 5</span>
            </div>
          </div>
        </div>
      </div>

      <!-- 스타일 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>스타일</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <polyline points="4,10 8,6 12,10"/>
          </svg>
        </button>
        <div class="inspector__sec-body">
          <div class="inspector__field">
            <label class="inspector__field-label">모서리 둥글기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="mapBorderRadius" value="10" min="0" max="60">
              <span class="inspector__unit">px</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">그림자</label>
            <button class="inspector__onoff active" id="mapShadowToggle" type="button"></button>
          </div>
          <div id="mapShadowOptions">
            <div class="inspector__field">
              <label class="inspector__field-label">번짐</label>
              <div class="inspector__num-row">
                <input class="inspector__num-input" type="number" id="mapShadowBlur" value="16" min="0" max="60">
                <span class="inspector__unit">px</span>
              </div>
            </div>
            <div class="inspector__field">
              <label class="inspector__field-label">Y 거리</label>
              <div class="inspector__num-row">
                <input class="inspector__num-input" type="number" id="mapShadowY" value="2" min="0" max="40">
                <span class="inspector__unit">px</span>
              </div>
            </div>
            <div class="inspector__field">
              <label class="inspector__field-label">불투명도</label>
              <div class="inspector__num-row">
                <input class="inspector__num-input" type="number" id="mapShadowOpacity" value="12" min="0" max="100">
                <span class="inspector__unit">%</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div><!-- /.inspector__body -->
    <div class="inspector__footer">
      <div class="inspector__footer-actions">
        <button class="inspector__footer-btn" id="mapReset" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M2.5 8a5.5 5.5 0 1 0 1.1-3.3"/>
            <polyline points="2.5,2 2.5,5.5 6,5.5"/>
          </svg>
          초기화
        </button>
      </div>
    </div>
  </aside>

</div>
<script src="../js/map.js"></script>
</body>
</html>
