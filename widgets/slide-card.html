<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬라이드 카드 위젯</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/slide-card.css">
</head>
<body>
<div class="app">

  <main class="editor__canvas editor__canvas--slide-card">
    <div id="slideCardWrap"></div>
  </main>

  <aside class="inspector" id="slideCardInspector">
    <div class="inspector__head">
      <span class="inspector__title">슬라이드 카드</span>
      <button class="inspector__close" id="scInspectorClose" aria-label="닫기">&#x2715;</button>
    </div>
    <div class="inspector__body">

      <!-- 슬라이드 목록 -->
      <div class="inspector__section">
        <button class="inspector__sec-toggle" type="button">
          <span>슬라이드 목록</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">
          <button class="inspector__sec-add" id="scAddSlide" type="button">+ 슬라이드 추가</button>
          <div id="scSlideList"></div>
        </div>
      </div>

      <!-- 텍스트 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>텍스트</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <p class="inspector__group-label">타이틀</p>
          <div class="inspector__field">
            <label class="inspector__field-label">크기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scTitleSize" value="24" min="10" max="80">
              <span class="inspector__unit">px</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="scTitleSwatch" style="background:#ffffff">
                <input type="color" class="inspector__color-native" id="scTitlePicker" value="#ffffff">
              </span>
              <input type="text" class="inspector__hex-input" id="scTitleHex" value="#FFFFFF" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="scTitleOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>

          <p class="inspector__group-label">서브텍스트</p>
          <div class="inspector__field">
            <label class="inspector__field-label">크기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scSubtitleSize" value="16" min="10" max="60">
              <span class="inspector__unit">px</span>
            </div>
          </div>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="scSubtitleSwatch" style="background:#ffffff">
                <input type="color" class="inspector__color-native" id="scSubtitlePicker" value="#ffffff">
              </span>
              <input type="text" class="inspector__hex-input" id="scSubtitleHex" value="#FFFFFF" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="scSubtitleOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 콘텐츠 레이아웃 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>콘텐츠 레이아웃</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">텍스트 위치</label>
            <select class="inspector__select" id="scPosition">
              <option value="top-left">왼쪽상단</option>
              <option value="top-center">중앙상단</option>
              <option value="top-right">오른쪽상단</option>
              <option value="mid-left">왼쪽중앙</option>
              <option value="mid-center">정중앙</option>
              <option value="mid-right">오른쪽중앙</option>
              <option value="bot-left" selected>왼쪽하단</option>
              <option value="bot-center">중앙하단</option>
              <option value="bot-right">오른쪽하단</option>
            </select>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">텍스트 간격</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scTitleGap" value="6" min="0" max="40">
              <span class="inspector__unit">px</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 카드 레이아웃 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>카드 레이아웃</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">카드 비율</label>
            <select class="inspector__select" id="scCardRatio">
              <option value="1.0">1:1</option>
              <option value="1.25">4:5</option>
              <option value="1.34" selected>3:4</option>
              <option value="1.5">2:3</option>
              <option value="1.78">9:16</option>
              <option value="2.0">1:2</option>
            </select>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">카드 너비</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scCardWidth" value="342" min="100" max="800">
              <span class="inspector__unit">px</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">카드 간격</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scCardGap" value="30" min="0" max="100">
              <span class="inspector__unit">px</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">내부 상하 여백</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scPaddingV" value="32" min="0" max="100">
              <span class="inspector__unit">px</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">내부 좌우 여백</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scPaddingH" value="38" min="0" max="100">
              <span class="inspector__unit">px</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">모서리 둥글기</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scBorderRadius" value="12" min="0" max="100">
              <span class="inspector__unit">px</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 좌우 버튼 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>좌우 버튼</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">화살표 스타일</label>
            <div class="inspector__segment" id="scArrowSegment">
              <button class="inspector__seg-btn active" data-value="chevron" type="button">꺾쇠</button>
              <button class="inspector__seg-btn" data-value="arrow" type="button">화살표</button>
            </div>
          </div>

          <p class="inspector__group-label">화살표 색상</p>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="scArrowSwatch" style="background:#4b515b">
                <input type="color" class="inspector__color-native" id="scArrowPicker" value="#4b515b">
              </span>
              <input type="text" class="inspector__hex-input" id="scArrowHex" value="#4B515B" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="scArrowOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>

          <p class="inspector__group-label">버튼 배경 색상</p>
          <div class="inspector__field">
            <label class="inspector__field-label">컬러</label>
            <div class="inspector__color-row">
              <span class="inspector__swatch" id="scArrowBgSwatch" style="background:#ffffff">
                <input type="color" class="inspector__color-native" id="scArrowBgPicker" value="#ffffff">
              </span>
              <input type="text" class="inspector__hex-input" id="scArrowBgHex" value="#FFFFFF" maxlength="7" spellcheck="false">
              <input type="number" class="inspector__opacity-input" id="scArrowBgOpacity" value="100" min="0" max="100">
              <span class="inspector__pct">%</span>
            </div>
          </div>

        </div>
      </div>

      <!-- 슬라이드 애니메이션 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>슬라이드 애니메이션</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">중앙 이미지 확대</label>
            <button class="inspector__onoff active" id="scCenterScale" type="button"></button>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">마우스 오버 확대</label>
            <button class="inspector__onoff active" id="scHoverScale" type="button"></button>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">자동 재생</label>
            <button class="inspector__onoff" id="scAutoplay" type="button"></button>
          </div>

          <div id="scAutoplaySpeedField" style="display:none">
            <div class="inspector__field">
              <label class="inspector__field-label">자동재생 속도</label>
              <div class="inspector__num-row">
                <input class="inspector__num-input" type="number" id="scAutoplaySpeed" value="3000" min="500" max="10000">
                <span class="inspector__unit">ms</span>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- 등장 애니메이션 -->
      <div class="inspector__section collapsed">
        <button class="inspector__sec-toggle" type="button">
          <span>등장 애니메이션</span>
          <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
        </button>
        <div class="inspector__sec-body">

          <div class="inspector__field">
            <label class="inspector__field-label">스타일</label>
            <select class="inspector__select" id="scAnimStyle">
              <option value="none" selected>없음</option>
              <option value="fade">페이드</option>
              <option value="slide-up">슬라이드인-업</option>
              <option value="slide-down">슬라이드인-다운</option>
              <option value="slide-left">슬라이드인-왼쪽</option>
              <option value="slide-right">슬라이드인-오른쪽</option>
              <option value="zoom-in">줌-인</option>
            </select>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">지속 시간</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scAnimDuration" value="0.7" min="0.1" max="3" step="0.1">
              <span class="inspector__unit">초</span>
            </div>
          </div>

          <div class="inspector__field">
            <label class="inspector__field-label">지연 시간</label>
            <div class="inspector__num-row">
              <input class="inspector__num-input" type="number" id="scAnimDelay" value="0" min="0" max="5" step="0.1">
              <span class="inspector__unit">초</span>
            </div>
          </div>

        </div>
      </div>

    </div><!-- /.inspector__body -->
    <div class="inspector__footer">
      <div class="inspector__footer-actions">
        <button class="inspector__footer-btn" id="scReset" type="button">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
            <path d="M2.5 8a5.5 5.5 0 1 0 1.1-3.3"/>
            <polyline points="2.5,2 2.5,5.5 6,5.5"/>
          </svg>
          초기화
        </button>
        <button class="inspector__footer-btn" id="scReplay" type="button">
          <svg viewBox="0 0 16 16" fill="currentColor" width="12" height="12">
            <polygon points="4,2 14,8 4,14"/>
          </svg>
          다시 재생
        </button>
      </div>
    </div>
  </aside>

</div>
<script src="../js/slide-card.js"></script>
</body>
</html>
