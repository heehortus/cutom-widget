<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이미지 FAQ 위젯</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/image-faq.css">
</head>
<body>
<div class="app">

      <main class="editor__canvas editor__canvas--image-faq">
        <div class="wg-ac" id="imgFaqWrap"></div>
      </main>

      <aside class="inspector" id="imgFaqInspector">
        <div class="inspector__head">
          <span class="inspector__title">이미지 FAQ</span>
          <button class="inspector__close" id="imgFaqInspectorClose" aria-label="닫기">&#x2715;</button>
        </div>
        <div class="inspector__body">

          <!-- 아이템 섹션 -->
          <div class="inspector__section collapsed">
              <button class="inspector__sec-toggle" type="button">
                <span>아이템</span>
                <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
              </button>
            <div class="inspector__sec-body">
              <button class="inspector__sec-add" id="addImfItem" type="button">+ 추가</button>
              <div id="imfItemList"></div>
            </div>
          </div>

          <!-- 이미지 섹션 -->
          <div class="inspector__section collapsed">
            <button class="inspector__sec-toggle" type="button">
              <span>이미지</span>
              <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
            </button>
            <div class="inspector__sec-body">
              <div class="inspector__field">
                <label class="inspector__field-label">이미지</label>
                <div style="display:flex;flex-direction:column;gap:6px">
                  <div class="inspector__img-upload" id="imfImgUploadWrap">
                    <div class="inspector__img-thumb" id="imfImgThumb">
                      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><polyline points="8,10 8,3"/><polyline points="5,6 8,3 11,6"/><path d="M3 12v.5A1.5 1.5 0 004.5 14h7a1.5 1.5 0 001.5-1.5V12"/></svg>
                    </div>
                    <button class="inspector__img-clear" id="imfImgClear" type="button" title="이미지 제거">&#x2715;</button>
                    <input type="file" accept="image/*" id="imfImgFile" style="display:none">
                  </div>
                  <input type="text" class="inspector__text-input" id="imfImgUrl" placeholder="또는 URL 입력">
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">배경색</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="imfImgBgSwatch" style="background:#e8e8e8">
                    <input type="color" class="inspector__color-native" id="imfImgBgPicker" value="#e8e8e8">
                  </span>
                  <input type="text" class="inspector__hex-input" id="imfImgBgHex" value="#E8E8E8" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="imfImgBgOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">모서리</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfImgRadius" value="16" min="0" max="80">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
            </div>
          </div>

          <!-- 텍스트 섹션 -->
          <div class="inspector__section collapsed">
            <button class="inspector__sec-toggle" type="button">
              <span>텍스트</span>
              <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
            </button>
            <div class="inspector__sec-body">

              <p class="inspector__group-label">아이템 타이틀</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfTitleSize" value="24" min="8" max="80">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="imfTitleSwatch" style="background:#222222">
                    <input type="color" class="inspector__color-native" id="imfTitlePicker" value="#222222">
                  </span>
                  <input type="text" class="inspector__hex-input" id="imfTitleHex" value="#222222" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="imfTitleOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

              <p class="inspector__group-label">소제목</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfDTitleSize" value="20" min="8" max="60">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="imfDTitleSwatch" style="background:#555555">
                    <input type="color" class="inspector__color-native" id="imfDTitlePicker" value="#555555">
                  </span>
                  <input type="text" class="inspector__hex-input" id="imfDTitleHex" value="#555555" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="imfDTitleOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

              <p class="inspector__group-label">내용</p>
              <div class="inspector__field">
                <label class="inspector__field-label">크기</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfDBodySize" value="16" min="8" max="40">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="imfDBodySwatch" style="background:#5e5e5e">
                    <input type="color" class="inspector__color-native" id="imfDBodyPicker" value="#5e5e5e">
                  </span>
                  <input type="text" class="inspector__hex-input" id="imfDBodyHex" value="#5E5E5E" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="imfDBodyOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>

            </div>
          </div>

          <!-- 레이아웃 섹션 -->
          <div class="inspector__section collapsed">
            <button class="inspector__sec-toggle" type="button">
              <span>레이아웃</span>
              <svg class="inspector__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="4,10 8,6 12,10"/></svg>
            </button>
            <div class="inspector__sec-body">
              <div class="inspector__field">
                <label class="inspector__field-label">좌우 간격</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfGap" value="24" min="0" max="120">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">아이템 간격</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfItemGap" value="16" min="0" max="60">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">아이템 모서리</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfItemRadius" value="16" min="0" max="80">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">테두리 컬러</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="imfBorderSwatch" style="background:#e1e1e1">
                    <input type="color" class="inspector__color-native" id="imfBorderPicker" value="#e1e1e1">
                  </span>
                  <input type="text" class="inspector__hex-input" id="imfBorderHex" value="#E1E1E1" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="imfBorderOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">아이템 배경</label>
                <div class="inspector__color-row">
                  <span class="inspector__swatch" id="imfItemBgSwatch" style="background:#ffffff">
                    <input type="color" class="inspector__color-native" id="imfItemBgPicker" value="#ffffff">
                  </span>
                  <input type="text" class="inspector__hex-input" id="imfItemBgHex" value="#FFFFFF" maxlength="7" spellcheck="false">
                  <input type="number" class="inspector__opacity-input" id="imfItemBgOpacity" value="100" min="0" max="100">
                  <span class="inspector__pct">%</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">헤더 세로 여백</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfHeadPy" value="28" min="0" max="80">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
              <div class="inspector__field">
                <label class="inspector__field-label">헤더 가로 여백</label>
                <div class="inspector__num-row">
                  <input class="inspector__num-input" type="number" id="imfHeadPx" value="32" min="0" max="80">
                  <span class="inspector__unit">px</span>
                </div>
              </div>
            </div>
          </div>

        </div><!-- /.inspector__body -->
        <div class="inspector__footer">
          <button class="inspector__delete-btn" id="imgFaqDelete" type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
              <polyline points="2,4 14,4"/>
              <path d="M5,4V3a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1V4"/>
              <rect x="3" y="4" width="10" height="10" rx="1"/>
              <line x1="6" y1="7" x2="6" y2="11"/>
              <line x1="10" y1="7" x2="10" y2="11"/>
            </svg>
            위젯 삭제
          </button>
        </div>
      </aside>

</div>
<script src="../js/image-faq.js"></script>
</body>
</html>
